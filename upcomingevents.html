<center>
<h1>Upcoming Events</h1>
</center>
<div id="tournament-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
    <p>Loading tournaments...</p>
</div>
<p id="last-updated" style="font-size: 0.8rem; color: #999; text-align: center; margin-top: 20px;"></p>


<script>
async function loadTournaments() {
  const container = document.getElementById('tournament-container');
  console.log("Starting loadTournaments...");

  try {
    // Try to fetch the file
    const response = await fetch('tournaments.json');
    
    if (!response.ok) {
      throw new Error(`Could not find tournaments.json (Status: ${response.status})`);
    }

    const result = await response.json();
    console.log("JSON loaded successfully:", result);

    if (result.updatedAt) {
      const date = new Date(result.updatedAt).toLocaleString();
      document.getElementById('last-updated').innerText = `Last sync: ${date}`;
    }

    // Pass the data to the display function
    displayTournaments(result.data); 

  } catch (error) {
    console.error("Critical Error:", error);
    container.innerHTML = `<p style="color:red">Error: ${error.message}<br>Check if tournaments.json exists in your GitHub repo.</p>`;
  }
}

function displayTournaments(tournamentData) {
    const container = document.getElementById('tournament-container');
    console.log("Processing tournament data...");

    if (!tournamentData) {
        container.innerHTML = "<p>Data structure is empty.</p>";
        return;
    }

    let allNodes = [];
    Object.keys(tournamentData).forEach(region => {
        if (tournamentData[region] && tournamentData[region].nodes) {
            allNodes = allNodes.concat(tournamentData[region].nodes);
        }
    });

    console.log("Total tournaments found before filtering:", allNodes.length);

    // BROADENED FILTER: Check for 'Ultimate' AND 'Singles' in the same event
    const filtered = allNodes.filter(t => 
        t.events?.some(e => {
            const name = e.name.toLowerCase();
            return (name.includes('ultimate') && name.includes('singles')) || 
                   name.includes('ssbu singles') || 
                   name.includes('smash ultimate');
        })
    );

    console.log("Tournaments after filtering:", filtered.length);

    // Deduplicate
    const unique = Array.from(new Map(filtered.map(item => [item.id, item])).values());
    unique.sort((a, b) => a.startAt - b.startAt);

    if (unique.length === 0) {
        container.innerHTML = "<p>No upcoming tournaments match the 'Ultimate Singles' filter.</p>";
        return;
    }

    // Build the HTML
    container.innerHTML = unique.map(t => {
        const dateStr = new Date(t.startAt * 1000).toLocaleDateString("en-US", {
            weekday: 'short', month: 'short', day: 'numeric'
        });

        const imgObj = t.images.find(i => i.type === 'banner') || t.images.find(i => i.type === 'profile');
        const imgUrl = imgObj ? imgObj.url : 'https://placehold.co/400x200?text=No+Image';

        // Get entrant count
        const eventObj = t.events.find(e => e.name.toLowerCase().includes('singles')) || t.events[0];
        const entrants = eventObj ? eventObj.numEntrants : t.numAttendees;

        return `
            <a href="https://start.gg/${t.slug}" target="_blank" class="t-card">
                <img src="${imgUrl}" alt="${t.name}" height="150px">
                <div class="t-info">
                    <h2 class="t-name">${t.name}</h2>
                    <div class="t-meta">📅 ${dateStr}</div>
                    <div class="t-meta">📍 ${t.city}, ${t.addrState}</div>
                    <span class="t-entrants">👥 ${entrants || 0} Entrants</span>
                </div>
            </a>
        `;
    }).join('');
}

// Execute
loadTournaments();
</script>
