name: Update Tournament Data

on:
  push:
    branches: [ main ]    # Runs when you push code
  workflow_dispatch:      # Adds the manual "Run" button
  schedule:
    - cron: '0 0 * * *'   # Runs every night

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Fetch Data
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
        run: node fetch_data.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tournaments.json
          git commit -m "Automated tournament data update" || exit 0
          git pull --rebase origin main
          git push origin main
